name: Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install dependencies
        run: npm install

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonttools fontforge python3-fontforge inkscape

      - name: Build
        run: make

      - name: Upload TTF
        uses: actions/upload-artifact@v7.0.1
        with:
          path: build/Twemoji Mozilla.ttf
          archive: false

  release:
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    needs: build

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1

      - name: Rename TTF
        run: mv 'Twemoji Mozilla.ttf' TwemojiMozilla.ttf

      - name: Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: TwemojiMozilla.ttf
